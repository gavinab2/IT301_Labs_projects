<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random User</title>
</head>
<body>
  <h1>User Profile</h1>
  <p>Generate a random user profile</p>

  <script>
    const site = 'https://randomuser.me/api/';

    let bttn = document.createElement('button');
    bttn.type = 'button';
    bttn.textContent = 'Generate Profile';

    let form = document.createElement('form');
    form.action = '#';
    form.appendChild(bttn);
    document.body.appendChild(form);


    let img = document.createElement('img');
    let name = document.createElement('p');
    let email = document.createElement('p');
    let phone = document.createElement('p');

    
    document.body.appendChild(img);
    document.body.appendChild(name);
    document.body.appendChild(email);
    document.body.appendChild(phone);




    const getProfile = async () => {
      try {
        let result = await fetch(site);
        result = await result.json();

        let user = result.results[0];

        img.src = user.picture.large;
        img.alt = user.name.first + ' ' + user.name.last;
        name.textContent = user.name.first + ' ' + user.name.last;
        email.textContent = user.email;
        phone.textContent = user.phone;
      } catch{(reason)=>console.log(reason);{
      }
    };}

    bttn.addEventListener('click', getProfile);


  </script>
</body>
</html>
